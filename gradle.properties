android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Without an explicit heap, Gradle's daemon defaults to a small fraction of
# available RAM, which isn't enough once desugaring + D8 dexing kick in on
# constrained CI runners — the daemon gets killed by GC thrashing mid-build.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g

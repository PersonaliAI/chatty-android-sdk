# chatty-sdk's compileSdk (37, see build.gradle.kts) tracks whatever Android
# Studio's current project wizard defaults to, ahead of what test tooling
# supports — Robolectric only has shadows through SDK 36 as of the version
# pinned in build.gradle.kts (see the comment there), and picking the
# module's own compileSdk as the emulated test SDK (Robolectric's default
# with no override) throws a hard IllegalArgumentException on an SDK it
# doesn't know about. Pin every RobolectricTestRunner test in this module to
# a known-supported, well-exercised level instead of chasing compileSdk.
sdk=34

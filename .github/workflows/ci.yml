name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Lint chatty-sdk
        run: ./gradlew :chatty-sdk:lint

      - name: Assemble chatty-sdk (debug + release)
        run: ./gradlew :chatty-sdk:assemble

      - name: Assemble example-app
        run: ./gradlew :example-app:assembleDebug

      - name: Unit tests
        run: ./gradlew :chatty-sdk:testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: chatty-sdk/build/reports/lint-results-*.html
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    # A stuck step (e.g. a stalled Robolectric dependency download during
    # Unit tests) once ran for 3+ hours before being manually cancelled —
    # GitHub's own default job timeout is 360 minutes. Caps it far below that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Lint chatty-sdk
        run: ./gradlew :chatty-sdk:lint

      - name: Assemble chatty-sdk (debug + release)
        run: ./gradlew :chatty-sdk:assemble

      # chatty-example-app is its own Gradle root (pulls in :chatty-sdk as a
      # sibling-directory source dependency) with its own wrapper — see
      # chatty-example-app/settings.gradle.kts.
      - name: Assemble chatty-example-app
        working-directory: chatty-example-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :chatty-sdk:testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: chatty-sdk/build/reports/lint-results-*.html
          if-no-files-found: ignore
